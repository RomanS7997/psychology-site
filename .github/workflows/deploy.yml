name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Карта сайта берёт дату правки каждой страницы из её истории.
          # При обычной выкладке сюда приезжает одна ревизия, и дат не видно.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Адрес сайта задаётся переменными репозитория (Settings → Secrets and
      # variables → Actions → Variables). Пока их нет, собирается прежний
      # адрес на github.io. Для переезда: SITE_URL=https://julialyapina.ru,
      # SITE_BASE=/ — трогать код не нужно.
      - name: Build Astro
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}

      # Свой домен GitHub Pages берёт из файла CNAME в корне сайта.
      # Пишем его только тогда, когда адрес действительно свой.
      - name: Write CNAME for custom domain
        if: ${{ vars.SITE_URL != '' && !contains(vars.SITE_URL, 'github.io') }}
        run: |
          domain="${{ vars.SITE_URL }}"
          domain="${domain#https://}"
          domain="${domain#http://}"
          domain="${domain%%/*}"
          echo "$domain" > dist/CNAME
          echo "CNAME: $domain"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # Выкладка на Beget (боевой домен julialyapina.ru)
  # ---------------------------------------------------------------------------
  # Включается сама, как только в репозитории появятся секреты FTP_HOST,
  # FTP_USER и FTP_PASSWORD (Settings -> Secrets and variables -> Actions ->
  # Secrets). Пока их нет — шаг тихо пропускается, и ничего не ломается.
  #
  # Первую выкладку лучше сделать руками: в корне сайта ещё лежит старый
  # WordPress, и его надо убрать осознанно, а не скриптом.
  beget:
    runs-on: ubuntu-latest
    # Оборванная FTP-сессия умеет висеть до упора. Пятнадцати минут хватает
    # с запасом даже на полную перезаливку с видео.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Есть ли доступы
        id: check
        run: |
          if [ -n "${{ secrets.FTP_HOST }}" ] && [ -n "${{ secrets.FTP_USER }}" ] && [ -n "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "Секретов FTP нет или они неполные — выкладка на Beget пропущена."
          fi

      - name: Setup Node
        if: steps.check.outputs.ready == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.ready == 'yes'
        run: npm ci

      - name: Build Astro для боевого домена
        if: steps.check.outputs.ready == 'yes'
        run: npm run build
        env:
          SITE_URL: https://julialyapina.ru
          SITE_BASE: /

      - name: Отправить на Beget
        if: steps.check.outputs.ready == 'yes'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Аккаунт заводится сразу на папке /julialyapina.ru/public_html —
          # значит, после входа мы уже в корне сайта и никуда идти не нужно.
          # Если доступ выдан на весь аккаунт, путь задаётся переменной FTP_DIR.
          FTP_DIR: ${{ vars.FTP_DIR || '.' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          # Пароль lftp берёт сам из переменной LFTP_PASSWORD (--env-password):
          # его нет ни в файле настроек, ни в строке команды, ни в списке
          # процессов, и он не ломается, если в нём кавычка или доллар.
          export LFTP_PASSWORD="$FTP_PASSWORD"
          umask 077
          cat > "$RUNNER_TEMP/lftp.rc" <<RC
          set ftp:use-feat no
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:use-site-chmod no
          set ssl:verify-certificate no
          set ssl:priority "NORMAL:-VERS-TLS1.3"
          set net:max-retries 4
          set net:reconnect-interval-base 3
          set net:reconnect-interval-multiplier 1.5
          set net:timeout 40
          set xfer:clobber on
          open --env-password -u "$FTP_USER" "$FTP_HOST"
          RC

          # Почему выкладка ползла по файлу в минуту.
          #
          # С шифрованием FTP открывает на каждый файл отдельный защищённый
          # канал данных, и сервер требует, чтобы этот канал продолжал TLS-сессию
          # основного. В TLS 1.3 такое продолжение устроено иначе, и серверы
          # этого поколения принимают его через раз: мелкие файлы падали и
          # пробивались только с пятой-седьмой попытки, а 21-мегабайтное видео,
          # которому нужен один канал, прошло сразу. Отсюда ssl:priority —
          # TLS 1.2, где продолжение сессии работает предсказуемо. Шифрование
          # при этом остаётся и на пароле, и на файлах.
          #
          # И второе: вместо одного прохода с бесконечными попытками — несколько
          # коротких. mirror сам пропускает то, что уже лежит на сервере, так
          # что каждый следующий проход доливает только недостающее. Сбой на
          # одном файле больше не роняет всю выкладку.
          for pass in 1 2 3 4 5; do
            echo "::group::Проход $pass"
            if lftp -f <(cat "$RUNNER_TEMP/lftp.rc"; echo "mirror -R --no-perms --parallel=2 --verbose=1 dist/ \"$FTP_DIR\"; bye"); then
              echo "проход $pass: lftp завершился без ошибок"
              echo "::endgroup::"
              break
            fi
            echo "проход $pass: были сбои, доливаю следующим проходом"
            echo "::endgroup::"
            sleep 5
          done
          rm -f "$RUNNER_TEMP/lftp.rc"
          unset LFTP_PASSWORD

      # Выкладка считается сделанной не тогда, когда lftp промолчал, а когда
      # каждый файл сборки отдаётся с живого домена. Это и есть проверка.
      - name: Проверить, что всё доехало
        if: steps.check.outputs.ready == 'yes'
        run: |
          missing=0
          total=0
          while IFS= read -r f; do
            rel="${f#dist/}"
            case "$rel" in .htaccess) continue ;; esac
            total=$((total+1))
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://julialyapina.ru/$rel")
            case "$code" in
              200|301|302) ;;
              *) echo "НЕТ ($code): $rel"; missing=$((missing+1)) ;;
            esac
          done < <(find dist -type f | sort)
          echo "на сервере: $((total-missing)) из $total"
          if [ "$missing" -gt 0 ]; then
            echo "::error::Не доехало файлов: $missing"
            exit 1
          fi
