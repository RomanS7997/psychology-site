name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Адрес сайта задаётся переменными репозитория (Settings → Secrets and
      # variables → Actions → Variables). Пока их нет, собирается прежний
      # адрес на github.io. Для переезда: SITE_URL=https://julialyapina.ru,
      # SITE_BASE=/ — трогать код не нужно.
      - name: Build Astro
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}

      # Свой домен GitHub Pages берёт из файла CNAME в корне сайта.
      # Пишем его только тогда, когда адрес действительно свой.
      - name: Write CNAME for custom domain
        if: ${{ vars.SITE_URL != '' && !contains(vars.SITE_URL, 'github.io') }}
        run: |
          domain="${{ vars.SITE_URL }}"
          domain="${domain#https://}"
          domain="${domain#http://}"
          domain="${domain%%/*}"
          echo "$domain" > dist/CNAME
          echo "CNAME: $domain"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
