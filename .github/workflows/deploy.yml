name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Карта сайта берёт дату правки каждой страницы из её истории.
          # При обычной выкладке сюда приезжает одна ревизия, и дат не видно.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Адрес сайта задаётся переменными репозитория (Settings → Secrets and
      # variables → Actions → Variables). Пока их нет, собирается прежний
      # адрес на github.io. Для переезда: SITE_URL=https://julialyapina.ru,
      # SITE_BASE=/ — трогать код не нужно.
      - name: Build Astro
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}

      # Свой домен GitHub Pages берёт из файла CNAME в корне сайта.
      # Пишем его только тогда, когда адрес действительно свой.
      - name: Write CNAME for custom domain
        if: ${{ vars.SITE_URL != '' && !contains(vars.SITE_URL, 'github.io') }}
        run: |
          domain="${{ vars.SITE_URL }}"
          domain="${domain#https://}"
          domain="${domain#http://}"
          domain="${domain%%/*}"
          echo "$domain" > dist/CNAME
          echo "CNAME: $domain"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # Выкладка на Beget (боевой домен julialyapina.ru)
  # ---------------------------------------------------------------------------
  # Включается сама, как только в репозитории появятся секреты FTP_HOST,
  # FTP_USER и FTP_PASSWORD (Settings -> Secrets and variables -> Actions ->
  # Secrets). Пока их нет — шаг тихо пропускается, и ничего не ломается.
  #
  # Первую выкладку лучше сделать руками: в корне сайта ещё лежит старый
  # WordPress, и его надо убрать осознанно, а не скриптом.
  beget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Есть ли доступы
        id: check
        run: |
          if [ -n "${{ secrets.FTP_HOST }}" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "Секретов FTP нет — выкладка на Beget пропущена."
          fi

      - name: Setup Node
        if: steps.check.outputs.ready == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.ready == 'yes'
        run: npm ci

      - name: Build Astro для боевого домена
        if: steps.check.outputs.ready == 'yes'
        run: npm run build
        env:
          SITE_URL: https://julialyapina.ru
          SITE_BASE: /

      - name: Отправить на Beget
        if: steps.check.outputs.ready == 'yes'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Аккаунт заводится сразу на папке /julialyapina.ru/public_html —
          # значит, после входа мы уже в корне сайта и никуда идти не нужно.
          # Если доступ выдан на весь аккаунт, путь задаётся переменной FTP_DIR.
          FTP_DIR: ${{ vars.FTP_DIR || '.' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # ssl-force, а не ssl-allow: «allow» означает «зашифруй, если сервер
          # предложит», и при любой заминке пароль уходит открытым текстом,
          # ничего об этом не сказав. Шифрование у Beget есть — проверено
          # вручную, AUTH TLS отвечает 234 и поднимает TLS 1.3, — просто сервер
          # не объявляет его в списке возможностей. Так что требуем.
          #
          # verify-certificate выключен сознательно: Beget показывает на FTP
          # сертификат, выписанный не на этот домен и не на имя своего сервера,
          # так что проверить подлинность нечем. Шифрование от подслушивания
          # защищает, от подмены сервера — нет. Полную проверку даёт SFTP:
          # если у FTP-аккаунта включить SSH, этот шаг переводится на него.
          #
          # Без --delete: лишний старый файл вреда не делает, а снести чужое
          # одной опечаткой в пути — делает.
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:timeout 30;
            open -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_HOST\";
            mirror -R --verbose --parallel=4 dist/ \"$FTP_DIR\";
          "
