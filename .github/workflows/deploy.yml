name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Карта сайта берёт дату правки каждой страницы из её истории.
          # При обычной выкладке сюда приезжает одна ревизия, и дат не видно.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Адрес сайта задаётся переменными репозитория (Settings → Secrets and
      # variables → Actions → Variables). Пока их нет, собирается прежний
      # адрес на github.io. Для переезда: SITE_URL=https://julialyapina.ru,
      # SITE_BASE=/ — трогать код не нужно.
      - name: Build Astro
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}

      # Свой домен GitHub Pages берёт из файла CNAME в корне сайта.
      # Пишем его только тогда, когда адрес действительно свой.
      - name: Write CNAME for custom domain
        if: ${{ vars.SITE_URL != '' && !contains(vars.SITE_URL, 'github.io') }}
        run: |
          domain="${{ vars.SITE_URL }}"
          domain="${domain#https://}"
          domain="${domain#http://}"
          domain="${domain%%/*}"
          echo "$domain" > dist/CNAME
          echo "CNAME: $domain"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # Выкладка на Beget (боевой домен julialyapina.ru)
  # ---------------------------------------------------------------------------
  # Включается сама, как только в репозитории появятся секреты FTP_HOST,
  # FTP_USER и FTP_PASSWORD (Settings -> Secrets and variables -> Actions ->
  # Secrets). Пока их нет — шаг тихо пропускается, и ничего не ломается.
  #
  # Первую выкладку лучше сделать руками: в корне сайта ещё лежит старый
  # WordPress, и его надо убрать осознанно, а не скриптом.
  beget:
    runs-on: ubuntu-latest
    # Оборванная FTP-сессия умеет висеть до упора. Пятнадцати минут хватает
    # с запасом даже на полную перезаливку с видео.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Есть ли доступы
        id: check
        run: |
          if [ -n "${{ secrets.FTP_HOST }}" ] && [ -n "${{ secrets.FTP_USER }}" ] && [ -n "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "Секретов FTP нет или они неполные — выкладка на Beget пропущена."
          fi

      - name: Setup Node
        if: steps.check.outputs.ready == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.ready == 'yes'
        run: npm ci

      - name: Build Astro для боевого домена
        if: steps.check.outputs.ready == 'yes'
        run: npm run build
        env:
          SITE_URL: https://julialyapina.ru
          SITE_BASE: /

      - name: Отправить на Beget
        if: steps.check.outputs.ready == 'yes'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Аккаунт заводится сразу на папке /julialyapina.ru/public_html —
          # значит, после входа мы уже в корне сайта и никуда идти не нужно.
          # Если доступ выдан на весь аккаунт, путь задаётся переменной FTP_DIR.
          FTP_DIR: ${{ vars.FTP_DIR || '.' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          # Пароль lftp берёт сам из переменной LFTP_PASSWORD (--env-password):
          # его нет ни в файле настроек, ни в строке команды, ни в списке
          # процессов, и он не ломается, если в нём кавычка или доллар.
          export LFTP_PASSWORD="$FTP_PASSWORD"
          umask 077
          cat > "$RUNNER_TEMP/lftp.rc" <<RC
          set ftp:use-feat no
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:use-site-chmod no
          set ssl:verify-certificate no
          set ssl:priority "NORMAL:-VERS-TLS1.3"
          set net:max-retries 4
          set net:reconnect-interval-base 3
          set net:reconnect-interval-multiplier 1.5
          set net:timeout 40
          set xfer:clobber on
          open --env-password -u "$FTP_USER" "$FTP_HOST"
          RC

          # Почему выкладка ползла по файлу в минуту.
          #
          # С шифрованием FTP открывает на каждый файл отдельный защищённый
          # канал данных, и сервер требует, чтобы этот канал продолжал TLS-сессию
          # основного. В TLS 1.3 такое продолжение устроено иначе, и серверы
          # этого поколения принимают его через раз: мелкие файлы падали и
          # пробивались только с пятой-седьмой попытки, а 21-мегабайтное видео,
          # которому нужен один канал, прошло сразу. Отсюда ssl:priority —
          # TLS 1.2, где продолжение сессии работает предсказуемо. Шифрование
          # при этом остаётся и на пароле, и на файлах.
          #
          # И второе: вместо одного прохода с бесконечными попытками — несколько
          # коротких. mirror сам пропускает то, что уже лежит на сервере, так
          # что каждый следующий проход доливает только недостающее. Сбой на
          # одном файле больше не роняет всю выкладку.
          # Файлы, которых на сервере быть не должно. mirror без --delete их не
          # трогает (и правильно: снести чужое на общем хостинге одной опечаткой
          # в пути проще простого), поэтому удаляем поимённо. rm -f молчит,
          # если файла уже нет.
          #   _probe.php — разовый пробник протокола, своё отработал 04.10.2026
          #   img/       — картинки старого сайта; новый пользуется images/
          #
          # wp-content/ старого сайта здесь НЕТ, и это намеренно. По FTP папка
          # удаляется по одному файлу на запрос, а в выгрузке WordPress их тысячи:
          # 04.10.2026 выкладка стирала её полчаса и упёрлась в ограничение по
          # времени. Оставь её здесь — каждая выкладка тратила бы полчаса и
          # отменялась. Удаляется одним нажатием в файловом менеджере Beget:
          # там это делается на самом сервере, за секунды.
          #
          # Третья группа — файлы, убранные из сайта 11.10.2026: черновая
          # инструкция и посторонний портрет, лежавшие в открытом доступе,
          # дубли фотографий команды и варианты картинок, растянутые больше
          # исходника. Из репозитория они удалены, но mirror без --delete
          # оставил бы их на сервере навсегда.
          GONE="images/README.md
          images/adult-consulting.jpg
          images/adult-consulting.webp
          images/services/photo_2025-11-23_16-50-24.jpg
          images/services/photo_2025-11-23_16-50-24.webp
          images/watercolor-blue.jpg
          images/watercolor-blue.webp
          images/logo-256.png
          images/og-image.webp
          images/specialists/specialist-2.jpg
          images/specialists/specialist-2.webp
          images/gallery/azbuka/5-1120.webp
          images/gallery/umniky/2-1120.webp
          images/services/adult-consulting-1120.webp
          images/services/child-therapy-1120.webp
          images/services/school-prep-1120.webp"
          CLEANUP="rm -f \"$FTP_DIR/_probe.php\"; rm -r -f \"$FTP_DIR/img\"; rm -r -f \"$FTP_DIR/images/team\";"
          for f in $GONE; do
            # Страховка: если такой файл снова появился в сборке, не трогаем его
            if [ ! -e "dist/$f" ]; then CLEANUP="$CLEANUP rm -f \"$FTP_DIR/$f\";"; fi
          done

          for pass in 1 2 3 4 5; do
            echo "::group::Проход $pass"
            if lftp -f <(cat "$RUNNER_TEMP/lftp.rc"; echo "mirror -R --no-perms --parallel=2 --verbose=1 dist/ \"$FTP_DIR\"; $CLEANUP bye"); then
              echo "проход $pass: lftp завершился без ошибок"
              echo "::endgroup::"
              break
            fi
            echo "проход $pass: были сбои, доливаю следующим проходом"
            echo "::endgroup::"
            sleep 5
          done
          rm -f "$RUNNER_TEMP/lftp.rc"
          unset LFTP_PASSWORD

      # Выкладка считается сделанной не тогда, когда lftp промолчал, а когда
      # каждый файл сборки отдаётся с живого домена. Это и есть проверка.
      - name: Проверить, что всё доехало
        if: steps.check.outputs.ready == 'yes'
        run: |
          missing=0
          total=0
          while IFS= read -r f; do
            rel="${f#dist/}"
            case "$rel" in .htaccess) continue ;; esac
            total=$((total+1))
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://julialyapina.ru/$rel")
            case "$code" in
              200|301|302) ;;
              *) echo "НЕТ ($code): $rel"; missing=$((missing+1)) ;;
            esac
          done < <(find dist -type f | sort)
          echo "на сервере: $((total-missing)) из $total"

          # И обратная проверка: того, что должно было исчезнуть, на сервере нет
          leftover=0
          for gone in _probe.php img/favicon-32x32.png images/README.md images/services/photo_2025-11-23_16-50-24.jpg images/team/julia-lyapina.jpg; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://julialyapina.ru/$gone")
            case "$code" in
              404|410) ;;
              *) echo "ОСТАЛСЯ ($code): $gone"; leftover=$((leftover+1)) ;;
            esac
          done

          if [ "$missing" -gt 0 ] || [ "$leftover" -gt 0 ]; then
            echo "::error::Не доехало: $missing, не удалилось: $leftover"
            exit 1
          fi

      # Сразу после выкладки сообщаем Яндексу (и всем, кто поддерживает протокол
      # IndexNow) адреса страниц, которые менялись в последние дни. Без этого
      # робот узнаёт о правке, когда сам до неё дойдёт, — у молодого сайта это
      # дни и недели. Ключ — файл в корне сайта; он не секрет, поисковик сам
      # его скачивает, чтобы убедиться, что сообщение пришло от владельца.
      # Сбой здесь выкладку не роняет: сайт уже на месте и проверен.
      - name: Сообщить поисковикам об изменениях (IndexNow)
        if: steps.check.outputs.ready == 'yes'
        continue-on-error: true
        run: |
          key=$(ls dist | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          if [ -z "$key" ]; then echo "ключа IndexNow в сборке нет — пропускаю"; exit 0; fi

          python3 - "$key" <<'PY' > indexnow.json
          import datetime, json, re, sys
          key = sys.argv[1]
          since = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=2)).strftime("%Y-%m-%d")
          xml = open("dist/sitemap.xml", encoding="utf-8").read()
          urls = [loc for loc, mod in re.findall(r"<loc>([^<]+)</loc>\s*<lastmod>([^<]+)</lastmod>", xml) if mod >= since]
          print(json.dumps({
              "host": "julialyapina.ru",
              "key": key,
              "keyLocation": "https://julialyapina.ru/%s.txt" % key,
              "urlList": urls,
          }, ensure_ascii=False))
          PY

          count=$(python3 -c "import json; print(len(json.load(open('indexnow.json'))['urlList']))")
          echo "изменившихся страниц: $count"
          if [ "$count" = "0" ]; then echo "сообщать не о чем"; exit 0; fi

          # Первым идёт общий адрес протокола: он раздаёт сообщение всем
          # участникам, включая Яндекс. Прямой адрес Яндекса — вторым и не
          # обязателен: 11.10.2026 он обрывал соединение и с сервера выкладки,
          # и с домашнего адреса, и из-за этого обрыва падал весь шаг, не
          # дойдя до второго адреса. Теперь сбой одного адреса другому не мешает.
          for endpoint in https://api.indexnow.org/indexnow https://yandex.com/indexnow; do
            code=$(curl -s -o /tmp/indexnow.out -w '%{http_code}' --max-time 30 \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data-binary @indexnow.json "$endpoint" || true)
            echo "$endpoint -> ${code:-нет ответа} $(head -c 200 /tmp/indexnow.out 2>/dev/null || true)"
          done
